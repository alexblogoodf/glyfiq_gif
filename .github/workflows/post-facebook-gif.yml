name: Post GIF to Facebook Page (GIF format)

on:
  schedule:
    # Каждые 6 часов в :10 (генератор :00, fb-gif :10, fb-video :15, instagram :20, twitter :30, threads :45)
    - cron: '10 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-facebook-gif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Prepare GIF post
        run: python post_facebook_gif.py prepare

      - name: Publish GIF to Facebook Page
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python post_facebook_gif.py post

      - name: Commit Facebook GIF history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update facebook gif posted history [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
