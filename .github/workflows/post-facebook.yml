name: Post GIF to Facebook Page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Prepare post (используем готовый MP4 от Threads-скрипта)
        run: python post_facebook.py prepare

      - name: Publish to Facebook Page via Graph API
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python post_facebook.py post

      - name: Commit Facebook history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update facebook posted history [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
