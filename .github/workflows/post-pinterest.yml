name: Post GIF to Pinterest

on:
  schedule:
    - cron: '0 12,18 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Запустить debug (показать схему API и доски, без постинга)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  post-pinterest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Pinterest script
        env:
          PP_STORE_BUFFER_API_KEY: ${{ secrets.PP_STORE_BUFFER_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.debug }}" == "true" ]; then
            python post_pinterest.py debug
          else
            python post_pinterest.py
          fi

      - name: Commit Pinterest history
        if: github.event.inputs.debug != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/pinterest_posted_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update pinterest posted history [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
