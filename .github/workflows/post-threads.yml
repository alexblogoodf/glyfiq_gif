name: Post GIF to Threads

on:
  schedule:
    # Каждые 6 часов в :45 (генератор в :00, Twitter в :30)
    - cron: '45 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-threads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Prepare post (выбор GIF + конвертация в MP4)
        run: python post_threads.py prepare

      - name: Push MP4, чтобы он был доступен по ссылке
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add mp4 for threads post [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi

      - name: Publish to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python post_threads.py post

      - name: Commit Threads history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update threads posted history [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
